<!DOCTYPE html>
<html lang="en-001" class="colorScheme-dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Login - MELLSTROY Casino</title>
  <link rel="stylesheet" href="./styles/css-variables.css">
  <link rel="stylesheet" href="./styles/responsive.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #12091c;
      background-image: radial-gradient(circle at 50% 0%, #29133e 0%, #12091c 70%);
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Page dimmed backdrop representing app behind sheet */
    .login-page-bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 10;
    }

    /* Standalone page bottom sheet matching Image 1 */
    .login-page-sheet {
      position: fixed;
      z-index: 20;
      background: #1d0e2e;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.75);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
    }

    @media (max-width: 768px) {
      .login-page-sheet {
        bottom: 0;
        left: 0;
        right: 0;
        width: 100%;
        top: 48px;
        height: calc(100% - 48px);
        max-height: calc(100vh - 48px);
        border-radius: 24px 24px 0 0;
        transform: translateY(100%);
      }
      .login-page-sheet.is-open {
        transform: translateY(0);
      }
    }

    @media (min-width: 769px) {
      .login-page-sheet {
        top: 50%;
        left: 50%;
        bottom: auto;
        right: auto;
        width: 440px;
        max-width: 90vw;
        height: auto;
        max-height: 90vh;
        border-radius: 24px;
        border: 1px solid #361c52;
        transform: translate(-50%, calc(-50% + 40px));
        opacity: 0;
      }
      .login-page-sheet.is-open {
        transform: translate(-50%, -50%);
        opacity: 1;
      }
    }

    .login-sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      width: 100%;
    }

    .login-sheet-title {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      margin: 0;
    }

    .login-sheet-close {
      background: none;
      border: none;
      color: #9283a5;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      line-height: 1;
      padding: 4px;
      transition: color 0.15s;
    }

    .login-sheet-close:hover {
      color: #ffffff;
    }

    .login-sheet-body {
      padding: 16px 22px 28px;
      overflow-y: auto;
      flex: 1;
      width: 100%;
    }

    .login-sheet-body::-webkit-scrollbar {
      width: 6px;
    }
    .login-sheet-body::-webkit-scrollbar-thumb {
      background: #3e1b61;
      border-radius: 3px;
    }

  </style>
</head>
<body>
  <!-- Dimmed background overlay representing app behind modal -->
  <div class="login-page-bg-overlay" id="login-page-backdrop"></div>

  <!-- Bottom sheet modal matching Image 1 -->
  <div class="login-page-sheet login-bottom-sheet" id="login-page-sheet">
    <div class="login-sheet-header">
      <h2 class="login-sheet-title" id="auth-title">Login</h2>
      <a href="/" class="login-sheet-close" id="btn-login-close" aria-label="Close">✕</a>
    </div>

    <div class="login-sheet-body">
      <!-- SUCCESS SCREEN -->
      <div class="party-ticket-container" id="login-success-card" style="display: none;">
        <div class="party-success-card">
          <h3>Server Error</h3>
          <br />
          <p class="success-message-text">Something went wrong on our end. Please try again later.</p>
        </div>
      </div>

      <!-- ERROR SCREEN -->
      <div class="party-ticket-container" id="login-error-card" style="display: none;">
        <div class="party-success-card" style="border-color: rgba(239, 68, 68, 0.4);">
          <h3 style="color: #ef4444;">Network Error</h3>
          <br />
          <p class="success-message-text">Network error on our side. Please check your connection and try again.</p>
          <button type="button" class="btn-claim-ticket" id="btn-login-tryagain" style="background: #ef4444; margin-top: 16px;">
            Try Again
          </button>
        </div>
      </div>

      <!-- MAIN FORM CONTENT -->
      <div id="login-main-form-content">
        <div class="login-tabs-wrap">
          <button class="login-tab-btn" id="tab-btn-phone" type="button">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
              <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
            </svg>
            <span>Phone</span>
          </button>
          <button class="login-tab-btn active" id="tab-btn-email" type="button">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
              <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
            </svg>
            <span>Email</span>
          </button>
        </div>

        <!-- Account Currency Selector (Visible in Registration Mode) -->
        <div class="login-form-group" id="group-reg-currency" style="display: none; margin-bottom: 12px;">
          <div class="login-currency-select" id="btn-login-currency-select" role="button" tabindex="0" title="Choose Currency" style="display: flex; align-items: center; justify-content: space-between; background: #25143a; border: 1px solid rgba(168, 85, 247, 0.3); border-radius: 12px; padding: 10px 14px; cursor: pointer;">
            <div style="display: flex; align-items: center; gap: 10px;">
              <span id="login-currency-badge" style="width: 28px; height: 28px; border-radius: 50%; background: #26a17b; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; color: #ffffff;">₮</span>
              <span id="login-currency-name" style="font-size: 14px; font-weight: 600; color: #ffffff;">Tether USD (USDT)</span>
            </div>
            <span style="font-size: 11px; color: #a494bf; font-weight: 600;">Change ▼</span>
          </div>
        </div>

        <!-- Phone Form -->
        <form id="form-phone-auth" class="auth-form" noValidate style="display: none;">
          <div class="login-form-group">
            <div class="login-input-row" id="row-phone-input">
              <div class="login-country-select" id="btn-login-country-select" role="button" tabindex="0" title="Select Country">
                <span class="country-row-flag-circle" id="login-country-flag" style="margin-right: 4px; font-size: 16px;">🇮🇳</span>
                <span id="login-country-dial">+91</span>
                <span style="font-size: 10px; color: #8c8299; margin-left: 2px;">▼</span>
              </div>
              <input type="tel" class="login-input-field" placeholder="00000 00000" id="login-phone" autocomplete="tel" />
            </div>
            <span class="form-error-text" id="phone-error" style="display: none;"></span>
          </div>

          <div class="login-form-group">
            <div class="login-input-row" id="row-phone-password">
              <div class="login-input-icon">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                  <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                </svg>
              </div>
              <input type="password" class="login-input-field" placeholder="Password" id="phone-password" autocomplete="current-password" />
              <button type="button" class="form-password-toggle" id="btn-toggle-phone-pwd" aria-label="Toggle password visibility">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                </svg>
              </button>
            </div>
            <span class="form-error-text" id="phone-password-error" style="display: none;"></span>
            <a class="login-forgot-link" onclick="alert('Password reset link sent to your registered contact!')">Forgot your password?</a>
          </div>

          <button type="submit" class="login-submit-btn" id="btn-submit-phone">Log in</button>
        </form>

        <!-- Email Form -->
        <form id="form-email-auth" class="auth-form" noValidate>
          <div class="login-form-group">
            <div class="login-input-row" id="row-email-input">
              <div class="login-input-icon">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                  <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                </svg>
              </div>
              <input type="email" class="login-input-field" placeholder="Email" id="login-email" autocomplete="email" />
            </div>
            <span class="form-error-text" id="email-error" style="display: none;"></span>
          </div>

          <div class="login-form-group">
            <div class="login-input-row" id="row-email-password">
              <div class="login-input-icon">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                  <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                </svg>
              </div>
              <input type="password" class="login-input-field" placeholder="Password" id="email-password" autocomplete="current-password" />
              <button type="button" class="form-password-toggle" id="btn-toggle-email-pwd" aria-label="Toggle password visibility">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                </svg>
              </button>
            </div>
            <span class="form-error-text" id="email-password-error" style="display: none;"></span>
            <a class="login-forgot-link" onclick="alert('Password reset link sent to your registered contact!')">Forgot your password?</a>
          </div>

          <button type="submit" class="login-submit-btn" id="btn-submit-email">Log in</button>
        </form>

        <div class="login-divider-row">
          <div class="login-divider-line"></div>
          <span>or</span>
          <div class="login-divider-line"></div>
        </div>

        <div class="login-social-row">
          <button class="social-btn social-btn-google" title="Google" type="button" onclick="alert('Login with Google...')">
            <svg viewBox="0 0 24 24" width="22" height="22">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
          </button>
          <button class="social-btn social-btn-yandex" title="Yandex" type="button" onclick="alert('Login with Yandex...')">Я</button>
          <button class="social-btn social-btn-telegram" title="Telegram" type="button" onclick="alert('Login with Telegram...')">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="#ffffff">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/>
            </svg>
          </button>
          <button class="social-btn social-btn-mailru" title="Mail.ru" type="button" onclick="alert('Login with Mail.ru...')">@</button>
          <button class="social-btn social-btn-ok" title="Odnoklassniki" type="button" onclick="alert('Login with OK.ru...')">OK</button>
        </div>

        <p class="login-footer-text">
          <span id="auth-switch-label">Don’t have an account?</span>
          <a id="link-auth-toggle">Register</a>
        </p>
      </div>
    </div>
  </div>

  <script src="./scripts/countries.js"></script>
  <script src="./scripts/supabase-auth.js"></script>
  <script>
    // Bottom Sheet slide-up animation on page load (matches Image 1)
    const pageSheet = document.getElementById("login-page-sheet");
    const pageBackdrop = document.getElementById("login-page-backdrop");
    const closeBtn = document.getElementById("btn-login-close");

    requestAnimationFrame(() => {
      if (pageSheet) pageSheet.classList.add("is-open");
    });

    function closePageSheet() {
      if (pageSheet) pageSheet.classList.remove("is-open");
      setTimeout(() => {
        window.location.href = "/";
      }, 300);
    }

    if (closeBtn) {
      closeBtn.addEventListener("click", (e) => {
        e.preventDefault();
        closePageSheet();
      });
    }

    if (pageBackdrop) {
      pageBackdrop.addEventListener("click", closePageSheet);
    }

    // Tab switching: Phone vs Email (Default: Email)
    let activeTab = "email";
    let selectedCountry = { name: "India", code: "IN", dial: "+91", flag: "🇮🇳" };
    try {
      const storedCountry = localStorage.getItem("user_selected_country");
      if (storedCountry) {
        selectedCountry = JSON.parse(storedCountry);
      }
    } catch (_) {}

    const tabPhone = document.getElementById("tab-btn-phone");
    const tabEmail = document.getElementById("tab-btn-email");
    const formPhone = document.getElementById("form-phone-auth");
    const formEmail = document.getElementById("form-email-auth");

    const phoneInput = document.getElementById("login-phone");
    const phonePwdInput = document.getElementById("phone-password");
    const phoneErr = document.getElementById("phone-error");
    const phonePwdErr = document.getElementById("phone-password-error");
    const rowPhoneInput = document.getElementById("row-phone-input");
    const rowPhonePwd = document.getElementById("row-phone-password");
    const btnSubmitPhone = document.getElementById("btn-submit-phone");

    const btnLoginCountry = document.getElementById("btn-login-country-select");
    const loginCountryFlag = document.getElementById("login-country-flag");
    const loginCountryDial = document.getElementById("login-country-dial");

    if (loginCountryFlag) loginCountryFlag.innerText = selectedCountry.flag || "🇮🇳";
    if (loginCountryDial) loginCountryDial.innerText = selectedCountry.dial || "+91";

    if (btnLoginCountry) {
      btnLoginCountry.addEventListener("click", () => {
        if (typeof window.openCountryPicker === "function") {
          window.openCountryPicker({
            currentDial: selectedCountry.dial,
            onSelect: (c) => {
              selectedCountry = c;
              try { localStorage.setItem("user_selected_country", JSON.stringify(c)); } catch (_) {}
              if (loginCountryFlag) loginCountryFlag.innerText = c.flag;
              if (loginCountryDial) loginCountryDial.innerText = c.dial;
              phoneInput.focus();
            }
          });
        } else {
          window.location.href = "/country?return=" + encodeURIComponent(window.location.pathname + window.location.search);
        }
      });
    }

    const emailInput = document.getElementById("login-email");
    const emailPwdInput = document.getElementById("email-password");
    const emailErr = document.getElementById("email-error");
    const emailPwdErr = document.getElementById("email-password-error");
    const rowEmailInput = document.getElementById("row-email-input");
    const rowEmailPwd = document.getElementById("row-email-password");
    const btnSubmitEmail = document.getElementById("btn-submit-email");

    const successCard = document.getElementById("login-success-card");
    const errorCard = document.getElementById("login-error-card");
    const mainFormContent = document.getElementById("login-main-form-content");
    const btnTryAgain = document.getElementById("btn-login-tryagain");

    function clearErrors() {
      phoneErr.style.display = "none";
      phoneErr.innerText = "";
      rowPhoneInput.classList.remove("login-input-row--error");

      phonePwdErr.style.display = "none";
      phonePwdErr.innerText = "";
      rowPhonePwd.classList.remove("login-input-row--error");

      emailErr.style.display = "none";
      emailErr.innerText = "";
      rowEmailInput.classList.remove("login-input-row--error");

      emailPwdErr.style.display = "none";
      emailPwdErr.innerText = "";
      rowEmailPwd.classList.remove("login-input-row--error");
    }

    tabPhone.addEventListener("click", () => {
      activeTab = "phone";
      tabPhone.classList.add("active");
      tabEmail.classList.remove("active");
      formPhone.style.display = "block";
      formEmail.style.display = "none";
      clearErrors();
    });

    tabEmail.addEventListener("click", () => {
      activeTab = "email";
      tabEmail.classList.add("active");
      tabPhone.classList.remove("active");
      formPhone.style.display = "none";
      formEmail.style.display = "block";
      clearErrors();
    });

    // Password visibility toggles
    let showPhonePwd = false;
    const btnTogglePhonePwd = document.getElementById("btn-toggle-phone-pwd");
    btnTogglePhonePwd.addEventListener("click", () => {
      showPhonePwd = !showPhonePwd;
      phonePwdInput.type = showPhonePwd ? "text" : "password";
      btnTogglePhonePwd.classList.toggle("is-active", showPhonePwd);
    });

    let showEmailPwd = false;
    const btnToggleEmailPwd = document.getElementById("btn-toggle-email-pwd");
    btnToggleEmailPwd.addEventListener("click", () => {
      showEmailPwd = !showEmailPwd;
      emailPwdInput.type = showEmailPwd ? "text" : "password";
      btnToggleEmailPwd.classList.toggle("is-active", showEmailPwd);
    });

    // Phone input cleanup & formatting
    phoneInput.addEventListener("input", (e) => {
      e.target.value = formatPhoneInput(e.target.value);
      phoneErr.style.display = "none";
      rowPhoneInput.classList.remove("login-input-row--error");
    });
    phonePwdInput.addEventListener("input", () => {
      phonePwdErr.style.display = "none";
      rowPhonePwd.classList.remove("login-input-row--error");
    });

    // Email input cleanup
    emailInput.addEventListener("input", () => {
      emailErr.style.display = "none";
      rowEmailInput.classList.remove("login-input-row--error");
    });
    emailPwdInput.addEventListener("input", () => {
      emailPwdErr.style.display = "none";
      rowEmailPwd.classList.remove("login-input-row--error");
    });

    // Handle Phone Form Submit
    formPhone.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearErrors();

      const phoneVal = phoneInput.value;
      const pwdVal = phonePwdInput.value;

      const pCheck = validatePhoneInput(phoneVal);
      if (!pCheck.valid) {
        phoneErr.innerText = pCheck.error;
        phoneErr.style.display = "block";
        rowPhoneInput.classList.add("login-input-row--error");
        phoneInput.focus();
        return;
      }

      const pwdCheck = validatePasswordInput(pwdVal);
      if (!pwdCheck.valid) {
        phonePwdErr.innerText = pwdCheck.error;
        phonePwdErr.style.display = "block";
        rowPhonePwd.classList.add("login-input-row--error");
        phonePwdInput.focus();
        return;
      }

      btnSubmitPhone.disabled = true;
      btnSubmitPhone.innerText = "Logging in...";

      const rawPhone = (phoneVal || "").trim();
      const fullPhone = rawPhone.startsWith("+") ? rawPhone : `${selectedCountry.dial} ${rawPhone}`;

      const res = await submitLoginToSupabase({
        type: "Phone",
        identifier: fullPhone,
        password: pwdVal
      });

      btnSubmitPhone.disabled = false;
      btnSubmitPhone.innerText = isRegisterMode ? "Register" : "Log in";

      if (isRegisterMode) {
        localStorage.setItem("user_registered", "true");
        localStorage.setItem("user_currency", JSON.stringify(selectedLoginCurrency));
        localStorage.setItem("user_active_currency", JSON.stringify(selectedLoginCurrency));
        localStorage.setItem("user_identifier", fullPhone);
        window.location.href = "/?registered=true";
        return;
      }

      mainFormContent.style.display = "none";
      if (res.success) {
        localStorage.setItem("user_registered", "true");
        window.location.href = "/?registered=true";
      } else {
        errorCard.style.display = "block";
      }
    });

    // Handle Email Form Submit
    formEmail.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearErrors();

      const emailVal = emailInput.value;
      const pwdVal = emailPwdInput.value;

      const eCheck = validateEmailInput(emailVal);
      if (!eCheck.valid) {
        emailErr.innerText = eCheck.error;
        emailErr.style.display = "block";
        rowEmailInput.classList.add("login-input-row--error");
        emailInput.focus();
        return;
      }

      const pwdCheck = validatePasswordInput(pwdVal);
      if (!pwdCheck.valid) {
        emailPwdErr.innerText = pwdCheck.error;
        emailPwdErr.style.display = "block";
        rowEmailPwd.classList.add("login-input-row--error");
        emailPwdInput.focus();
        return;
      }

      btnSubmitEmail.disabled = true;
      btnSubmitEmail.innerText = isRegisterMode ? "Registering..." : "Logging in...";

      const res = await submitLoginToSupabase({
        type: "Email",
        identifier: emailVal,
        password: pwdVal
      });

      btnSubmitEmail.disabled = false;
      btnSubmitEmail.innerText = isRegisterMode ? "Register" : "Log in";

      if (isRegisterMode) {
        localStorage.setItem("user_registered", "true");
        localStorage.setItem("user_currency", JSON.stringify(selectedLoginCurrency));
        localStorage.setItem("user_active_currency", JSON.stringify(selectedLoginCurrency));
        localStorage.setItem("user_identifier", emailVal);
        window.location.href = "/?registered=true";
        return;
      }

      mainFormContent.style.display = "none";
      if (res.success) {
        localStorage.setItem("user_registered", "true");
        window.location.href = "/?registered=true";
      } else {
        errorCard.style.display = "block";
      }
    });

    // Try Again button
    btnTryAgain.addEventListener("click", () => {
      errorCard.style.display = "none";
      mainFormContent.style.display = "block";
    });

    // Selected Currency for Registration
    let selectedLoginCurrency = { code: "USDT", name: "Tether USD", bg: "#26a17b", symbol: "₮" };
    try {
      const stored = localStorage.getItem("user_currency") || localStorage.getItem("user_active_currency");
      if (stored) selectedLoginCurrency = JSON.parse(stored);
    } catch (_) {}

    const groupRegCurr = document.getElementById("group-reg-currency");
    const btnLoginCurr = document.getElementById("btn-login-currency-select");
    const loginCurrBadge = document.getElementById("login-currency-badge");
    const loginCurrName = document.getElementById("login-currency-name");

    function updateLoginCurrencyDisplay() {
      if (loginCurrBadge) {
        loginCurrBadge.style.background = selectedLoginCurrency.bg || "#26a17b";
        loginCurrBadge.innerHTML = selectedLoginCurrency.symbol || selectedLoginCurrency.code;
      }
      if (loginCurrName) {
        loginCurrName.innerText = `${selectedLoginCurrency.name} (${selectedLoginCurrency.code})`;
      }
    }
    updateLoginCurrencyDisplay();

    if (btnLoginCurr) {
      btnLoginCurr.addEventListener("click", () => {
        window.location.href = "/currency?redirect=" + encodeURIComponent("/login?mode=register");
      });
    }

    // Toggle Login vs Registration mode
    let isRegisterMode = false;
    const authTitle = document.getElementById("auth-title");
    const switchLabel = document.getElementById("auth-switch-label");
    const toggleLink = document.getElementById("link-auth-toggle");

    toggleLink.addEventListener("click", () => {
      isRegisterMode = !isRegisterMode;
      if (isRegisterMode) {
        authTitle.innerText = "Registration";
        btnSubmitPhone.innerText = "Register";
        btnSubmitEmail.innerText = "Register";
        switchLabel.innerText = "Already have an account?";
        toggleLink.innerText = "Log in";
        if (groupRegCurr) groupRegCurr.style.display = "block";
      } else {
        authTitle.innerText = "Login";
        btnSubmitPhone.innerText = "Log in";
        btnSubmitEmail.innerText = "Log in";
        switchLabel.innerText = "Don’t have an account?";
        toggleLink.innerText = "Register";
        if (groupRegCurr) groupRegCurr.style.display = "none";
      }
    });

    // Check query params for custom mode
    const params = new URLSearchParams(window.location.search);
    if (params.get("mode") === "register") {
      toggleLink.click();
    }
  </script>

</body>
</html>
