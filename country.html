<!DOCTYPE html>
<html lang="en" class="colorScheme-dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Choose country - MELLSTROY Casino</title>
  <link rel="stylesheet" href="./styles/css-variables.css">
  <link rel="stylesheet" href="./styles/responsive.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #12091c;
      background-image: radial-gradient(circle at 50% 0%, #29133e 0%, #12091c 70%);
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    .page-bg-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 10;
    }

    .country-page-sheet {
      position: fixed;
      z-index: 200050;
      background: #1d1130;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.75);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
    }

    @media (max-width: 768px) {
      .country-page-sheet {
        bottom: 0;
        left: 0;
        right: 0;
        width: 100%;
        top: 40px;
        height: calc(100% - 40px);
        max-height: calc(100vh - 40px);
        border-radius: 24px 24px 0 0;
        transform: translateY(100%);
      }
      .country-page-sheet.is-open {
        transform: translateY(0);
      }
    }

    @media (min-width: 769px) {
      .country-page-sheet {
        top: 50%;
        left: 50%;
        bottom: auto;
        right: auto;
        width: 440px;
        max-width: 92vw;
        height: auto;
        max-height: 90vh;
        border-radius: 24px;
        border: 1px solid #361c52;
        transform: translate(-50%, calc(-50% + 40px));
        opacity: 0;
      }
      .country-page-sheet.is-open {
        transform: translate(-50%, -50%);
        opacity: 1;
      }
    }

    .country-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px 14px;
      width: 100%;
    }

    .country-header-title {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.3px;
      margin: 0;
    }

    .country-header-close {
      background: none;
      border: none;
      color: #9b8ea9;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      line-height: 1;
      padding: 6px;
      border-radius: 50%;
      transition: color 0.15s, background-color 0.15s;
    }

    .country-header-close:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
    }

    .country-body {
      padding: 0 18px 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }

    .search-box-wrap {
      position: relative;
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      width: 100%;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      color: #796c8d;
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      height: 46px;
      background: #25163b;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 0 14px 0 42px;
      color: #ffffff;
      font-size: 14.5px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }

    .search-input:focus {
      border-color: #8b3ef7;
      background: #2c1a45;
    }

    .search-input::placeholder {
      color: #796c8d;
    }

    .countries-list-card {
      background: #211335;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      overflow-y: auto;
      max-height: calc(85vh - 120px);
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .countries-list-card::-webkit-scrollbar {
      width: 5px;
    }
    .countries-list-card::-webkit-scrollbar-thumb {
      background: #391d59;
      border-radius: 3px;
    }

    .country-item {
      width: 100%;
      display: flex;
      align-items: center;
      padding: 13px 16px;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      color: #ffffff;
      cursor: pointer;
      font-family: inherit;
      text-align: left;
      transition: background 0.15s;
    }

    .country-item:last-child {
      border-bottom: none;
    }

    .country-item:hover, .country-item:active {
      background: rgba(139, 62, 247, 0.16);
    }

    .country-item.selected {
      background: rgba(139, 62, 247, 0.22);
    }

    .country-flag {
      font-size: 22px;
      margin-right: 12px;
      flex-shrink: 0;
      line-height: 1;
    }

    .country-dial {
      font-size: 14.5px;
      font-weight: 700;
      color: #ffffff;
      min-width: 60px;
    }

    .country-name {
      font-size: 14px;
      color: #b7a8cf;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty-state {
      padding: 32px 16px;
      text-align: center;
      color: #8f81a7;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="page-bg-overlay" id="page-backdrop"></div>

  <div class="country-page-sheet" id="country-sheet">
    <div class="country-header">
      <h2 class="country-header-title">Choose country</h2>
      <a href="/login" class="country-header-close" id="btn-close-sheet" aria-label="Close">✕</a>
    </div>

    <div class="country-body">
      <div class="search-box-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input type="text" class="search-input" id="country-search-input" placeholder="Search" autocomplete="off" />
      </div>

      <div class="countries-list-card" id="countries-list-container"></div>
    </div>
  </div>

  <script src="./scripts/countries.js"></script>
  <script>
    const sheet = document.getElementById("country-sheet");
    const backdrop = document.getElementById("page-backdrop");
    const closeBtn = document.getElementById("btn-close-sheet");
    const searchInput = document.getElementById("country-search-input");
    const listContainer = document.getElementById("countries-list-container");

    let selectedDial = "+91";
    try {
      const stored = localStorage.getItem("user_selected_country");
      if (stored) {
        const parsed = JSON.parse(stored);
        if (parsed.dial) selectedDial = parsed.dial;
      }
    } catch (_) {}

    function renderCountries(query) {
      const list = window.WORLD_COUNTRIES || [];
      const q = (query || "").toLowerCase().trim();
      const filtered = list.filter(c => {
        if (!q) return true;
        const cleanDial = c.dial.replace("+", "");
        const cleanQ = q.replace("+", "");
        return c.name.toLowerCase().includes(q) ||
               c.code.toLowerCase().includes(q) ||
               c.dial.includes(q) ||
               cleanDial.startsWith(cleanQ);
      });

      if (filtered.length === 0) {
        listContainer.innerHTML = '<div class="empty-state">No countries found</div>';
        return;
      }

      let html = "";
      filtered.forEach(c => {
        const isSelected = selectedDial === c.dial;
        html += `
          <button type="button" class="country-item ${isSelected ? 'selected' : ''}" data-code="${c.code}" data-dial="${c.dial}">
            <span class="country-flag">${c.flag}</span>
            <span class="country-dial">${c.dial}</span>
            <span class="country-name">${c.name}</span>
          </button>
        `;
      });
      listContainer.innerHTML = html;

      listContainer.querySelectorAll(".country-item").forEach(btn => {
        btn.addEventListener("click", () => {
          const code = btn.getAttribute("data-code");
          const dial = btn.getAttribute("data-dial");
          const found = list.find(c => c.code === code && c.dial === dial);
          if (found) {
            localStorage.setItem("user_selected_country", JSON.stringify(found));
            closeSheet();
          }
        });
      });
    }

    function closeSheet() {
      sheet.classList.remove("is-open");
      backdrop.style.opacity = "0";
      setTimeout(() => {
        const params = new URLSearchParams(window.location.search);
        const ref = params.get("return") || params.get("redirect") || "/login";
        window.location.href = ref;
      }, 250);
    }

    closeBtn.addEventListener("click", (e) => {
      e.preventDefault();
      closeSheet();
    });

    backdrop.addEventListener("click", closeSheet);

    searchInput.addEventListener("input", (e) => {
      renderCountries(e.target.value);
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeSheet();
    });

    renderCountries("");
    requestAnimationFrame(() => {
      sheet.classList.add("is-open");
      setTimeout(() => {
        try { searchInput.focus(); } catch (_) {}
      }, 100);
    });
  </script>
</body>
</html>
