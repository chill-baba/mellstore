<!DOCTYPE html>
<html lang="en-001" class="colorScheme-dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Login - MELLSTROY Casino</title>
  <link rel="stylesheet" href="./styles/css-variables.css">
  <link rel="stylesheet" href="./styles/responsive.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #12091c;
      background-image: radial-gradient(circle at 50% 0%, #29133e 0%, #12091c 70%);
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .login-page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(18, 9, 28, 0.95);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .login-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #fff;
    }
    .login-logo img {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }
    .login-logo-text {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #ffffff;
    }
    .login-logo-text span {
      color: #b633fe;
    }
    .btn-back-casino {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #a79fb1;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 10px;
      background: #25143a;
      border: 1px solid #3c1e5e;
      transition: all 0.2s;
    }
    .btn-back-casino:hover {
      color: #ffffff;
      background: #341b52;
      border-color: #58298a;
    }
    .login-page-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .login-card-container {
      width: 100%;
      max-width: 440px;
      background: #1e112d;
      border: 1px solid #361c52;
      border-radius: 24px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6);
      padding: 24px 22px 28px;
    }
    .login-card-header {
      margin-bottom: 20px;
      text-align: center;
    }
    .login-card-title {
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.3px;
    }
    .login-card-subtitle {
      font-size: 13.5px;
      color: #9f96a9;
      margin-top: 6px;
    }
    .login-tabs-wrap {
      display: flex;
      background: #251338;
      border-radius: 14px;
      padding: 4px;
      gap: 4px;
      margin-bottom: 20px;
      width: 100%;
    }
    .login-tab-btn {
      flex: 1;
      height: 42px;
      border-radius: 10px;
      border: none;
      background: none;
      color: #8c8299;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .login-tab-btn.active {
      background: #ba49fb;
      color: #ffffff;
    }
    .login-form-group {
      margin-bottom: 16px;
    }
    .login-input-row {
      display: flex;
      align-items: center;
      background: #271439;
      border: 1px solid #3b1f55;
      border-radius: 14px;
      height: 48px;
      padding: 0 14px;
      transition: border-color 0.2s;
    }
    .login-input-row:focus-within {
      border-color: #ba49fb;
    }
    .login-country-select {
      display: flex;
      align-items: center;
      gap: 6px;
      padding-right: 12px;
      border-right: 1px solid #3d2157;
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      cursor: pointer;
      flex-shrink: 0;
    }
    .login-input-icon {
      margin-right: 12px;
      color: #8c8299;
      display: flex;
      align-items: center;
    }
    .login-input-field {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 15px;
      font-family: inherit;
      padding-left: 10px;
    }
    .login-input-field::placeholder {
      color: #6d627a;
    }
    .login-forgot-link {
      display: block;
      text-align: right;
      font-size: 12.5px;
      color: #a084c3;
      margin-top: 8px;
      text-decoration: none;
      cursor: pointer;
      transition: color 0.2s;
    }
    .login-forgot-link:hover {
      color: #c98afb;
    }
    .login-submit-btn {
      width: 100%;
      height: 48px;
      background: #2ee68c;
      color: #071f14;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s, transform 0.1s;
      box-shadow: 0 4px 16px rgba(46, 230, 140, 0.25);
    }
    .login-submit-btn:hover {
      background: #28cf7d;
    }
    .login-submit-btn:active {
      transform: scale(0.99);
    }
    .login-divider-row {
      display: flex;
      align-items: center;
      margin: 22px 0 18px;
      gap: 12px;
    }
    .login-divider-line {
      flex: 1;
      height: 1px;
      background: #331a47;
    }
    .login-divider-row span {
      color: #796c87;
      font-size: 12.5px;
      text-transform: uppercase;
      font-weight: 600;
    }
    .login-social-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 22px;
    }
    .social-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #271439;
      border: 1px solid #3d2157;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      color: #ffffff;
      font-weight: 700;
      font-size: 16px;
    }
    .social-btn:hover {
      background: #371b50;
      border-color: #602b8e;
    }
    .login-footer-text {
      text-align: center;
      font-size: 13.5px;
      color: #8c8299;
    }
    .login-footer-text a {
      color: #ba49fb;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      margin-left: 4px;
    }
    .login-footer-text a:hover {
      text-decoration: underline;
    }
    .info-notification-banner {
      background: rgba(186, 73, 251, 0.15);
      border: 1px solid rgba(186, 73, 251, 0.4);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 16px;
      display: none;
      font-size: 13px;
      color: #e5b9ff;
      text-align: center;
    }
  </style>
</head>
<body>
  <header class="login-page-header">
    <a href="/" class="login-logo">
      <img src="./images/11aa.png" alt="Mellstroy" onerror="this.style.display='none'">
      <div class="login-logo-text">MELL<span>STROY</span></div>
    </a>
    <a href="/" class="btn-back-casino">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
        <path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/>
      </svg>
      <span>Back to Casino</span>
    </a>
  </header>

  <main class="login-page-content">
    <div class="login-card-container">
      <div class="info-notification-banner" id="login-info-banner"></div>

      <div class="login-card-header">
        <h1 class="login-card-title" id="auth-title">Login</h1>
        <p class="login-card-subtitle" id="auth-subtitle">Log in to your account to play and save favorites</p>
      </div>

      <div class="login-tabs-wrap">
        <button class="login-tab-btn active" id="tab-btn-phone" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
          </svg>
          <span>Phone</span>
        </button>
        <button class="login-tab-btn" id="tab-btn-email" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
          </svg>
          <span>Email</span>
        </button>
      </div>

      <form id="form-login-auth" onsubmit="event.preventDefault(); alert('Login successful! Redirecting to Casino...'); window.location.href='/';">
        <div class="login-form-group" id="group-phone-input">
          <div class="login-input-row">
            <div class="login-country-select">
              <span>🇮🇳</span>
              <span>+91</span>
              <span style="font-size: 10px; color: #8c8299;">▼</span>
            </div>
            <input type="tel" class="login-input-field" placeholder="00000 00000" id="login-phone" />
          </div>
        </div>

        <div class="login-form-group" id="group-email-input" style="display: none;">
          <div class="login-input-row">
            <div class="login-input-icon">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
              </svg>
            </div>
            <input type="email" class="login-input-field" placeholder="Enter your email" id="login-email" />
          </div>
        </div>

        <div class="login-form-group">
          <div class="login-input-row">
            <div class="login-input-icon">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
              </svg>
            </div>
            <input type="password" class="login-input-field" placeholder="Password" id="login-password" required />
          </div>
          <a class="login-forgot-link" onclick="alert('Password reset link sent to your registered contact!')">Forgot your password?</a>
        </div>

        <button type="submit" class="login-submit-btn" id="btn-submit-auth">Log in</button>
      </form>

      <div class="login-divider-row">
        <div class="login-divider-line"></div>
        <span>or</span>
        <div class="login-divider-line"></div>
      </div>

      <div class="login-social-row">
        <button class="social-btn social-btn-google" title="Google" onclick="alert('Login with Google...')">
          <svg viewBox="0 0 24 24" width="22" height="22">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
        </button>
        <button class="social-btn social-btn-yandex" title="Yandex" onclick="alert('Login with Yandex...')">Я</button>
        <button class="social-btn social-btn-telegram" title="Telegram" onclick="alert('Login with Telegram...')">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="#ffffff">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/>
          </svg>
        </button>
        <button class="social-btn social-btn-mailru" title="Mail.ru" onclick="alert('Login with Mail.ru...')">@</button>
        <button class="social-btn social-btn-ok" title="Odnoklassniki" onclick="alert('Login with OK.ru...')">OK</button>
      </div>

      <p class="login-footer-text">
        <span id="auth-switch-label">Don't have an account?</span>
        <a id="link-auth-toggle">Register</a>
      </p>
    </div>
  </main>

  <script>
    // Tab switching: Phone vs Email
    const tabPhone = document.getElementById("tab-btn-phone");
    const tabEmail = document.getElementById("tab-btn-email");
    const groupPhone = document.getElementById("group-phone-input");
    const groupEmail = document.getElementById("group-email-input");

    tabPhone.addEventListener("click", () => {
      tabPhone.classList.add("active");
      tabEmail.classList.remove("active");
      groupPhone.style.display = "block";
      groupEmail.style.display = "none";
    });

    tabEmail.addEventListener("click", () => {
      tabEmail.classList.add("active");
      tabPhone.classList.remove("active");
      groupPhone.style.display = "none";
      groupEmail.style.display = "block";
    });

    // Toggle Login vs Registration mode
    let isRegisterMode = false;
    const authTitle = document.getElementById("auth-title");
    const authSubtitle = document.getElementById("auth-subtitle");
    const submitBtn = document.getElementById("btn-submit-auth");
    const switchLabel = document.getElementById("auth-switch-label");
    const toggleLink = document.getElementById("link-auth-toggle");
    const infoBanner = document.getElementById("login-info-banner");

    toggleLink.addEventListener("click", () => {
      isRegisterMode = !isRegisterMode;
      if (isRegisterMode) {
        authTitle.innerText = "Registration";
        authSubtitle.innerText = "Create your account to unlock all games and features";
        submitBtn.innerText = "Register";
        switchLabel.innerText = "Already have an account?";
        toggleLink.innerText = "Log in";
      } else {
        authTitle.innerText = "Login";
        authSubtitle.innerText = "Log in to your account to play and save favorites";
        submitBtn.innerText = "Log in";
        switchLabel.innerText = "Don't have an account?";
        toggleLink.innerText = "Register";
      }
    });

    // Check query params for custom message or mode
    const params = new URLSearchParams(window.location.search);
    if (params.get("reason") === "like" || params.get("reason") === "favorite") {
      infoBanner.style.display = "block";
      infoBanner.innerText = "⭐ Please log in to like games and save them to your favorites!";
    } else if (params.get("reason") === "required") {
      infoBanner.style.display = "block";
      infoBanner.innerText = "🔒 Please log in to access this section.";
    }

    if (params.get("mode") === "register") {
      toggleLink.click();
    }
  </script>
</body>
</html>
